name: Azure resource inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-resource-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure subscription
        run: az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Install Azure Resource Graph extension
        run: az extension add --name resource-graph --yes

      - name: Export Azure resource inventory
        run: python3 scripts/azure_inventory.py --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: azure-resource-inventory-${{ github.run_id }}
          path: inventory/
          if-no-files-found: error
          retention-days: 14
